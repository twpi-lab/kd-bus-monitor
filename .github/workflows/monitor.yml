name: KD 버스 모니터링

on:
  schedule:
    # UTC 기준 22~14시 = KST 07~23시, 매시 0분
    - cron: '0 22-23 * * *'
    - cron: '0 0-14 * * *'
  workflow_dispatch:  # 수동 실행 버튼

permissions:
  contents: write  # state/ 폴더 자동 커밋용

concurrency:
  group: monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Python 3.12 설치
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: 의존성 설치
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Playwright 브라우저 설치
        run: python -m playwright install --with-deps chromium

      - name: 모니터링 1회 실행
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python main.py --once

      - name: 크롤링 전체 실패 감지
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python -c "
          import json, os, requests
          af = os.path.join('state', 'all_notices.json')
          if not os.path.exists(af):
              exit(0)
          with open(af) as f:
              notices = json.load(f)
          # collected_at이 오늘인 공고가 0건이면 이상 알림
          from datetime import datetime
          today = datetime.utcnow().strftime('%Y-%m-%d')
          today_count = sum(1 for n in notices if n.get('collected_at','').startswith(today))
          if today_count == 0:
              token = os.environ.get('TELEGRAM_BOT_TOKEN','')
              chat  = os.environ.get('TELEGRAM_CHAT_ID','')
              if token and chat:
                  msg = '⚠️ <b>[모니터링 이상]</b>\n금일 수집된 공고가 0건입니다.\n전체 사이트 크롤링 실패 가능성 — 확인 필요'
                  requests.post(f'https://api.telegram.org/bot{token}/sendMessage',
                      data={'chat_id': chat, 'text': msg, 'parse_mode': 'HTML'}, timeout=10)
          "

      - name: state/ 변경사항 커밋
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main || true
          if [ -n "$(git status --porcelain state/)" ]; then
            git add state/
            git commit -m "chore(state): auto-update [skip ci]"
            git push
          else
            echo "변경 없음"
          fi
